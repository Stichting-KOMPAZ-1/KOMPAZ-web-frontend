# Cache policy by path.
#   /assets/*  -> Vite content-hashed files: cache forever, never revalidate.
#   everything else (index.html, SPA routes, unhashed public/ files) -> always
#   revalidate. nginx emits ETag/Last-Modified, so unchanged files come back 304.
# Without an explicit header browsers fall back to heuristic caching of
# index.html, which is how users end up on an old entry point requesting chunks
# that no longer exist. Keyed on status as well so a 404 for a missing chunk is
# never cached long-term.
map "$status $uri" $cache_control {
    default                 "no-cache";
    "~^(200|304) /assets/"  "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (the `always` flag keeps them on error/404 responses too).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # connect-src can stay 'self' because everything the app talks to is served on
    # this origin: the proxy in front (@igne-agency/proxy, proxy/proxy.json) sends
    # the backend's paths to the backend, so the bundle never issues a cross-origin
    # request.
    # The two Google Fonts hosts are the one exception: src/style/variables/fonts.scss
    # imports the Fustat/Inter stylesheet from fonts.googleapis.com, which in turn
    # serves the woff2 files from fonts.gstatic.com. Both are needed -- allowing only
    # the stylesheet host swaps the style-src violation for a font-src one.
    # Google Analytics is the other: src/lib/analytics.ts loads its tag from
    # googletagmanager.com, which reports to google-analytics.com and
    # analytics.google.com. These are the sources Google documents for GA4; without
    # them the tag is blocked and measures nothing, with no error in the app.
    # frame-src lists the video players embedVideoUrl in
    # src/components/content-block/content-block-utils.ts produces; keep the two in sync.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Set via the map above so it lives at server level: an add_header inside a
    # location block would drop every server-level header for that location.
    add_header Cache-Control $cache_control always;

    # The backend's paths (/api, /sanctum and Nova's) never reach this server: the
    # proxy in front sends them to the backend, by the list in proxy/proxy.json.
    # Nova therefore never gets this server's Content-Security-Policy, which its
    # inline scripts would not survive; the backend sets the panel's own headers.

    # Hashed build output. A missing chunk (stale index.html after a deploy) must
    # be a 404, not the SPA fallback: serving index.html as a JS module makes the
    # browser throw "Failed to fetch dynamically imported module".
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
