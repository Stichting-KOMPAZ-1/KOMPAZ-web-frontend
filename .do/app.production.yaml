# App Platform spec for the production frontend.
#
# NOT READY TO APPLY. The production backend has no code deployed: its fortrabbit
# app (en-j8qfex) answers every path with fortrabbit's own 403 "no code has been
# deployed yet" page, and it has no custom domain, so there is nothing for
# BACKEND_ORIGIN to point at yet. Fill in the two values below once it is
# deployed, then:
#   doctl apps create --spec .do/app.production.yaml
# Then put the id it prints into the DO_APP_ID_PRODUCTION repository secret.
#
# After creation DigitalOcean holds the live spec. This file is the bootstrap and
# the record of which variables an environment needs -- it is not kept in sync
# automatically, so change both when one of them moves.
name: kompaz-web-frontend
region: ams

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# No domain yet. Add the production hostname here once it is decided, the way the
# development app carries kompaz.igne.link.

services:
  - name: web
    dockerfile_path: /Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    # See the development spec: nginx needs a fraction of this.
    instance_size_slug: apps-s-1vcpu-0.5gb

    github:
      repo: Stichting-KOMPAZ-1/KOMPAZ-web-frontend
      branch: main
      # CI gates on build, typecheck and lint before it calls
      # `doctl apps create-deployment`, so DigitalOcean must not also deploy by
      # itself the moment a commit lands.
      deploy_on_push: false

    envs:
      # Inlined into the bundle by Vite, hence BUILD_TIME. A path rather than a
      # URL: nginx proxies it to the backend on this same origin.
      - key: VITE_API_BASEURL
        scope: BUILD_TIME
        value: /api

      # Read by nginx at container start, hence RUN_TIME. Use the backend's real
      # public origin, not its frbit.app default, if that ends up redirecting the
      # way development's does.
      - key: BACKEND_ORIGIN
        scope: RUN_TIME
        value: https://CHANGE_ME
      - key: BACKEND_HOST
        scope: RUN_TIME
        value: CHANGE_ME

    health_check:
      http_path: /

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
